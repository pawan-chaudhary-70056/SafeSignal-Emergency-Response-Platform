<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeSignal – Emergency Response</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("safesignal-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored ? stored === "dark" : prefersDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          /* Theme falls back to light when storage is unavailable. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
