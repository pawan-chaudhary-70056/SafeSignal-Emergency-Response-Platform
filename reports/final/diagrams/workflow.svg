<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-label="SafeSignal end-to-end emergency response workflow">
  <defs>
    <linearGradient id="gCitizen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gDispatcher" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gResponder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .lane { font-size: 20px; font-weight: 800; }
      .lane-sub { font-size: 13px; font-weight: 600; fill: #64748b; letter-spacing: 1px; }
      .step { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .step-sub { font-size: 13px; fill: #64748b; }
      .note { font-size: 13.5px; fill: #475569; }
      .badge { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <rect x="28" y="24" width="1544" height="932" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g class="font">
    <text x="70" y="80" font-size="38" font-weight="800" fill="#0f172a" letter-spacing="-1">End-to-End Emergency Workflow</text>
    <text x="70" y="114" font-size="18" fill="#475569">One shared incident record from the first report to the final close, with a validated transition at every stage.</text>

    <rect x="1238" y="56" width="288" height="38" rx="19" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="1382" y="81" text-anchor="middle" class="badge" fill="#0f766e">10 LIFECYCLE STATES + 2 EXITS</text>

    <!-- Citizen lane -->
    <rect x="70" y="150" width="1460" height="180" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="70" y="150" width="12" height="180" rx="6" fill="url(#gCitizen)"/>
    <text x="104" y="190" class="lane" fill="#047857">Citizen</text>
    <text x="104" y="214" class="lane-sub">REPORT &amp; FOLLOW</text>

    <g filter="url(#soft)">
      <rect x="250" y="190" width="250" height="95" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    </g>
    <text x="268" y="221" class="step">1 · Report emergency</text>
    <text x="268" y="244" class="step-sub">Category · description · contact</text>
    <text x="268" y="266" class="step-sub">Location or landmark · evidence</text>

    <g filter="url(#soft)">
      <rect x="620" y="190" width="250" height="95" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    </g>
    <text x="638" y="221" class="step">2 · Track progress</text>
    <text x="638" y="244" class="step-sub">Live status, responder progress</text>
    <text x="638" y="266" class="step-sub">In-app notifications + map</text>

    <g filter="url(#soft)">
      <rect x="1190" y="190" width="280" height="95" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    </g>
    <text x="1208" y="221" class="step">8 · Closure visible</text>
    <text x="1208" y="244" class="step-sub">Final status and resolution</text>
    <text x="1208" y="266" class="step-sub">Full personal history retained</text>

    <rect x="880" y="298" width="330" height="24" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="894" y="315" class="step-sub" fill="#b91c1c">Eligible cancel → CANCELLED (owner only, before dispatch)</text>

    <!-- Dispatcher lane -->
    <rect x="70" y="360" width="1460" height="220" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="70" y="360" width="12" height="220" rx="6" fill="url(#gDispatcher)"/>
    <text x="104" y="400" class="lane" fill="#1d4ed8">Dispatcher</text>
    <text x="104" y="424" class="lane-sub">TRIAGE &amp; COORDINATE</text>

    <g filter="url(#soft)">
      <rect x="500" y="390" width="220" height="90" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    </g>
    <text x="518" y="420" class="step">3 · Review &amp; verify</text>
    <text x="518" y="443" class="step-sub">SUBMITTED → UNDER_REVIEW</text>
    <text x="518" y="465" class="step-sub">→ VERIFIED</text>

    <g filter="url(#soft)">
      <rect x="760" y="390" width="200" height="90" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    </g>
    <text x="778" y="420" class="step">4 · Set priority</text>
    <text x="778" y="443" class="step-sub">LOW · MEDIUM</text>
    <text x="778" y="465" class="step-sub">HIGH · CRITICAL</text>

    <g filter="url(#soft)">
      <rect x="1000" y="390" width="220" height="90" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    </g>
    <text x="1018" y="420" class="step">5 · Assign responder</text>
    <text x="1018" y="443" class="step-sub">Eligibility + availability</text>
    <text x="1018" y="465" class="step-sub">Reassign with a reason</text>

    <g filter="url(#soft)">
      <rect x="1330" y="390" width="150" height="90" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    </g>
    <text x="1348" y="420" class="step">7 · Close</text>
    <text x="1348" y="443" class="step-sub">RESOLVED</text>
    <text x="1348" y="465" class="step-sub">→ CLOSED</text>

    <rect x="760" y="510" width="280" height="34" rx="17" fill="#fef2f2" stroke="#fecaca"/>
    <text x="776" y="532" class="step-sub" fill="#b91c1c">Reject report with reason → REJECTED</text>

    <!-- Responder lane -->
    <rect x="70" y="610" width="1460" height="280" rx="18" fill="#fffbeb" stroke="#fde68a"/>
    <rect x="70" y="610" width="12" height="280" rx="6" fill="url(#gResponder)"/>
    <text x="104" y="650" class="lane" fill="#b45309">Responder</text>
    <text x="104" y="674" class="lane-sub">ACT &amp; REPORT PROGRESS</text>

    <g filter="url(#soft)">
      <rect x="1000" y="640" width="220" height="90" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    </g>
    <text x="1018" y="670" class="step">6 · Accept assignment</text>
    <text x="1018" y="693" class="step-sub">ACCEPTED</text>
    <text x="1018" y="715" class="step-sub">or reject with reason</text>

    <g filter="url(#soft)">
      <rect x="1310" y="640" width="170" height="90" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    </g>
    <text x="1328" y="670" class="step">En route</text>
    <text x="1328" y="693" class="step-sub">EN_ROUTE</text>
    <text x="1328" y="715" class="step-sub">Live notification</text>

    <g filter="url(#soft)">
      <rect x="1310" y="770" width="170" height="90" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    </g>
    <text x="1328" y="800" class="step">Arrived</text>
    <text x="1328" y="823" class="step-sub">ARRIVED</text>
    <text x="1328" y="845" class="step-sub">On scene</text>

    <g filter="url(#soft)">
      <rect x="1000" y="770" width="220" height="90" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    </g>
    <text x="1018" y="800" class="step">In progress</text>
    <text x="1018" y="823" class="step-sub">IN_PROGRESS</text>
    <text x="1018" y="845" class="step-sub">Operational notes stay internal</text>

    <g filter="url(#soft)">
      <rect x="740" y="770" width="220" height="90" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    </g>
    <text x="758" y="800" class="step">Resolve</text>
    <text x="758" y="823" class="step-sub">RESOLVED + resolution notes</text>
    <text x="758" y="845" class="step-sub">Assignment COMPLETED</text>

    <rect x="740" y="640" width="220" height="90" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-dasharray="6 5"/>
    <text x="758" y="670" class="step">Reject assignment</text>
    <text x="758" y="693" class="step-sub">Reason preserved</text>
    <text x="758" y="715" class="step-sub">Dispatcher picks another</text>

    <!-- Arrows -->
    <path d="M375 285 C375 330, 470 340, 540 386" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="400" y="353" class="note">creates incident (SUBMITTED)</text>

    <line x1="720" y1="435" x2="752" y2="435" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
    <line x1="960" y1="435" x2="992" y2="435" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>

    <path d="M1110 480 C1110 540, 1110 590, 1110 632" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="1122" y="566" class="note">assignment notification</text>

    <line x1="1220" y1="685" x2="1302" y2="685" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
    <path d="M1395 730 L1395 762" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
    <line x1="1310" y1="815" x2="1228" y2="815" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
    <line x1="1000" y1="815" x2="968" y2="815" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>

    <path d="M850 770 C850 650, 1050 620, 1350 488" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="1000" y="608" class="note">dispatcher reviews outcome</text>

    <path d="M1405 488 C1405 370, 1420 310, 1420 289" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="1436" y="330" class="note">CLOSED</text>
    <text x="1436" y="349" class="note">event</text>

    <path d="M1430 250 C1460 320, 1480 500, 1462 610" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <path d="M560 285 C590 330, 600 360, 600 382" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>

    <path d="M700 480 C710 515, 730 527, 752 527" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ared)"/>
    <path d="M1020 685 C940 685, 930 700, 966 700" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ared)"/>
    <text x="758" y="744" class="note" fill="#b91c1c">rejected assignment returns to dispatch</text>

    <rect x="70" y="914" width="1460" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="800" y="933" text-anchor="middle" class="note">Every transition is validated against the lifecycle table, committed with status history and an audit record, then published as a realtime event.</text>
  </g>
</svg>
