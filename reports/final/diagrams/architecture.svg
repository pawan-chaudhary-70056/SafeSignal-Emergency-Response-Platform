<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="SafeSignal system architecture diagram">
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .card-title { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .card-sub { font-size: 15px; fill: #64748b; }
      .item { font-size: 15.5px; fill: #334155; }
      .small { font-size: 13px; fill: #64748b; }
      .module { font-size: 13.5px; font-weight: 600; fill: #0f172a; }
      .label { font-size: 13px; font-weight: 600; fill: #475569; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>
  <rect x="28" y="24" width="1544" height="852" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g class="font">
    <text x="70" y="82" font-size="38" font-weight="800" fill="#0f172a" letter-spacing="-1">SafeSignal — System Architecture</text>
    <text x="70" y="116" font-size="18" fill="#475569">React SPA · Express modular monolith · PostgreSQL as the source of truth · Socket.IO for live delivery</text>

    <rect x="1288" y="56" width="238" height="38" rx="19" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1407" y="81" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.4" fill="#047857">MODULAR MONOLITH</text>

    <text x="70" y="165" class="kicker">CLIENT</text>
    <text x="520" y="165" class="kicker">EDGE</text>
    <text x="860" y="135" class="kicker">APPLICATION</text>

    <!-- Client -->
    <g filter="url(#shadow)">
      <rect x="70" y="180" width="380" height="230" rx="20" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    </g>
    <rect x="70" y="180" width="380" height="8" rx="4" fill="url(#sky)"/>
    <circle cx="108" cy="222" r="18" fill="#eff6ff"/>
    <path d="M101 222h14M108 215v14" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="138" y="219" class="card-title">Web browser</text>
    <text x="138" y="241" class="card-sub">React 19 · TypeScript · Vite · Tailwind</text>
    <text x="96" y="278" class="item">• Role-based dashboards and SOS form</text>
    <text x="96" y="305" class="item">• Leaflet live incident map</text>
    <text x="96" y="332" class="item">• Socket.IO client with REST recovery</text>
    <text x="96" y="359" class="item">• Accessible, responsive, dark mode</text>
    <text x="96" y="388" class="small">HTTPS / cookie session</text>

    <!-- Edge -->
    <g filter="url(#shadow)">
      <rect x="520" y="180" width="270" height="230" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <rect x="520" y="180" width="270" height="8" rx="4" fill="#64748b"/>
    <circle cx="558" cy="222" r="18" fill="#f1f5f9"/>
    <path d="M551 217h14v10h-14zM551 217l7 5 7-5" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="588" y="219" class="card-title">Nginx</text>
    <text x="588" y="241" class="card-sub">Static host + reverse proxy</text>
    <text x="546" y="278" class="item">• Serves the built SPA</text>
    <text x="546" y="305" class="item">• Proxies /api/* to Express</text>
    <text x="546" y="332" class="item">• Upgrades /socket.io/*</text>
    <text x="546" y="359" class="item">• 2 MB upload limit</text>
    <text x="546" y="388" class="small">One trusted proxy hop</text>

    <!-- Application -->
    <g filter="url(#shadow)">
      <rect x="860" y="150" width="650" height="380" rx="22" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5"/>
    </g>
    <rect x="860" y="150" width="650" height="8" rx="4" fill="url(#emerald)"/>
    <text x="890" y="190" class="card-title">Express API · Node.js</text>
    <text x="890" y="213" class="card-sub">Layered middleware, validated requests, modular services</text>

    <rect x="890" y="232" width="590" height="54" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="906" y="255" class="label">Request pipeline</text>
    <text x="906" y="274" class="small">Helmet-style headers · CORS · CSRF · rate limit · Zod · auth/RBAC · request ID</text>

    <rect x="890" y="304" width="136" height="52" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="958" y="336" text-anchor="middle" class="module">Auth &amp; sessions</text>
    <rect x="1041" y="304" width="136" height="52" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1109" y="336" text-anchor="middle" class="module">Incidents</text>
    <rect x="1192" y="304" width="136" height="52" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1260" y="336" text-anchor="middle" class="module">Assignments</text>
    <rect x="1343" y="304" width="136" height="52" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1411" y="336" text-anchor="middle" class="module">Responders</text>

    <rect x="890" y="368" width="136" height="52" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="958" y="400" text-anchor="middle" class="module">Notifications</text>
    <rect x="1041" y="368" width="136" height="52" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="1109" y="400" text-anchor="middle" class="module">Evidence</text>
    <rect x="1192" y="368" width="136" height="52" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="1260" y="400" text-anchor="middle" class="module">Admin &amp; audit</text>
    <rect x="1343" y="368" width="136" height="52" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="1411" y="400" text-anchor="middle" class="module">Categories</text>

    <rect x="890" y="438" width="285" height="66" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="1032" y="464" text-anchor="middle" class="module">Socket.IO gateway</text>
    <text x="1032" y="485" text-anchor="middle" class="small">Authenticated rooms by user / role / incident</text>

    <rect x="1190" y="438" width="290" height="66" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="1335" y="464" text-anchor="middle" class="module">Background worker</text>
    <text x="1335" y="485" text-anchor="middle" class="small">Durable jobs · capped exponential retries</text>

    <!-- Map -->
    <g filter="url(#shadow)">
      <rect x="70" y="490" width="380" height="170" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
    <circle cx="108" cy="528" r="18" fill="#ecfdf5"/>
    <path d="M108 518c-6 0-10 4.4-10 9.8 0 7.3 10 15.2 10 15.2s10-7.9 10-15.2c0-5.4-4-9.8-10-9.8zm0 13.2a3.4 3.4 0 110-6.8 3.4 3.4 0 010 6.8z" fill="#059669"/>
    <text x="138" y="525" class="card-title">Leaflet + OpenStreetMap</text>
    <text x="138" y="548" class="card-sub">Map tiles and incident markers</text>
    <text x="96" y="585" class="item">• Priority-coloured pins</text>
    <text x="96" y="612" class="item">• Browser geolocation + manual picker</text>
    <text x="96" y="639" class="small">Tiles are an external service; no incident data is sent to OSM.</text>

    <!-- Worker -->
    <g filter="url(#shadow)">
      <rect x="520" y="490" width="270" height="170" rx="20" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    </g>
    <circle cx="558" cy="528" r="18" fill="#fffbeb"/>
    <path d="M551 534l5-11 5 11M553 530h6" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="588" y="525" class="card-title">Job worker</text>
    <text x="588" y="548" class="card-sub">Polls durable jobs</text>
    <text x="546" y="585" class="item">• PENDING → PROCESSING → DONE</text>
    <text x="546" y="612" class="item">• FAILED after max attempts</text>
    <text x="546" y="639" class="small">Survives restarts; no in-memory-only work.</text>

    <!-- PostgreSQL -->
    <g filter="url(#shadow)">
      <rect x="860" y="590" width="330" height="190" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    </g>
    <rect x="860" y="590" width="330" height="8" rx="4" fill="url(#sky)"/>
    <circle cx="898" cy="632" r="18" fill="#eff6ff"/>
    <path d="M890 623c0 2 7 4 8 4s8-2 8-4v18c0 2-7 4-8 4s-8-2-8-4zM890 632c0 2 7 4 8 4s8-2 8-4" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="928" y="629" class="card-title">PostgreSQL 16</text>
    <text x="928" y="652" class="card-sub">Primary source of truth</text>
    <text x="884" y="690" class="item">• Users, roles, sessions</text>
    <text x="884" y="717" class="item">• Incidents, assignments, evidence</text>
    <text x="884" y="744" class="item">• Notifications, audit, jobs</text>
    <text x="884" y="767" class="small">Prisma 6 · versioned SQL migrations</text>

    <!-- Redis -->
    <g filter="url(#shadow)">
      <rect x="1230" y="590" width="280" height="190" rx="20" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    </g>
    <circle cx="1268" cy="632" r="18" fill="#fef2f2"/>
    <path d="M1259 628l9-5 9 5-9 5zM1259 636l9 5 9-5M1259 644l9 5 9-5" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="1298" y="629" class="card-title">Redis 7</text>
    <text x="1298" y="652" class="card-sub">Optional acceleration layer</text>
    <text x="1254" y="690" class="item">• Rate-limit counters</text>
    <text x="1254" y="717" class="item">• Socket.IO adapter</text>
    <text x="1254" y="744" class="item">• Graceful degradation</text>
    <text x="1254" y="767" class="small">A Redis outage does not take down reporting.</text>

    <!-- Arrows -->
    <line x1="450" y1="295" x2="512" y2="295" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="481" y="283" text-anchor="middle" class="small">HTTPS</text>

    <line x1="790" y1="295" x2="852" y2="295" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="821" y="283" text-anchor="middle" class="small">REST + WS</text>

    <line x1="265" y1="410" x2="265" y2="482" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="277" y="451" class="small">map tiles</text>

    <line x1="1010" y1="530" x2="1010" y2="582" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="1022" y="562" class="small">Prisma ORM</text>

    <path d="M1400 530 C1400 560, 1380 570, 1370 582" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="1410" y="562" class="small">cache / pub-sub</text>

    <path d="M860 470 C820 470, 800 500, 790 530" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="774" y="474" text-anchor="end" class="small">enqueue async work</text>

    <path d="M790 610 C820 610, 835 640, 850 650" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="806" y="635" class="small">retry / persist</text>

    <rect x="860" y="808" width="650" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1185" y="834" text-anchor="middle" class="small">PostgreSQL remains authoritative; Redis and Socket.IO are delivery/acceleration only.</text>
  </g>
</svg>
